<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_application_1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Web Absensi Kelas</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #f8f9ff; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #f8f9ff; font-family: system-ui, sans-serif; color: #0b1c30;
      transition: opacity .4s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spin {
      width: 44px; height: 44px; border: 4px solid #dbe1ff;
      border-top-color: #0053db; border-radius: 50%; animation: sp 0.8s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    #loading p { margin: 0; font-size: 14px; color: #737686; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spin"></div>
    <p>Memuat Web Absensi Kelas...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function hideLoading() {
      var el = document.getElementById('loading');
      if (el && !el.classList.contains('hide')) {
        el.classList.add('hide');
        setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 400);
      }
    }

    window.addEventListener('flutter-first-frame', hideLoading);
    window.addEventListener('load', function() {
      setTimeout(hideLoading, 1500);
    });

    var obs = new MutationObserver(function() {
      if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, [flt-renderer]')) {
        hideLoading();
        obs.disconnect();
      }
    });
    obs.observe(document.body, { childList: true, subtree: true });

    setTimeout(hideLoading, 3000);
  </script>
</body>
</html>
